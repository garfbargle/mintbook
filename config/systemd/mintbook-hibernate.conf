# Escalate a lid suspend to hibernation on the MacBook8,1. Installed to
# /etc/systemd/sleep.conf.d/20-mintbook-hibernate.conf. See docs/hibernate.md.
#
# Why this file exists: this machine cannot use deep S3 (it wedges the Apple SPI
# keyboard/trackpad, measured 2026-09-08), so mintbook-s2idle.service forces
# s2idle. s2idle here costs ~1.8 W against deep S3's ~0.08 W -- a full charge
# is gone in about ten hours. Measured the hard way on 2026-09-09: the machine
# went to sleep at 54% and was flat by morning.
#
# suspend-then-hibernate keeps s2idle for short lid closes, where its cost is
# nothing and input survives, then writes the image to disk and powers off.
# Resume from disk is a full boot, so applespi probes over the working path.
#
# SuspendState is deliberately not set: writing "mem" already lands on s2idle
# because mintbook-s2idle.service owns /sys/power/mem_sleep. One authority.
#
# Undo: delete this file and `systemctl restart systemd-logind`.
[Sleep]
HibernateDelaySec=30min
