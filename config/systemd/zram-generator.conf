# Compressed swap in RAM for MacBook8,1 (7.7 GB, no disk swap).
# Installed to /etc/systemd/zram-generator.conf. See docs/hardware.md.
#
# Half of RAM as the uncompressed zram disk. zstd is built into this kernel
# (CONFIG_ZRAM_BACKEND_ZSTD). Undo: delete this file and
# `systemctl restart systemd-zram-setup@zram0` (or reboot).
[zram0]
zram-size = ram / 2
compression-algorithm = zstd
