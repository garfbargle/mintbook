# Cap the journal on MacBook8,1. Installed to
# /etc/systemd/journald.conf.d/mintbook.conf. See docs/hardware.md.
#
# Stock journald.conf is empty, so the default is 10% of the filesystem — the
# journal had grown to 302 MB. Undo: delete this file, `systemctl restart systemd-journald`.
[Journal]
SystemMaxUse=100M
SystemMaxFileSize=16M
