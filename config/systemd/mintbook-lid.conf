# Hand the lid switch to logind so it can escalate to hibernation. Installed to
# /etc/systemd/logind.conf.d/20-mintbook-lid.conf. See docs/hibernate.md.
#
# xfce4-power-manager holds a handle-lid-switch inhibitor by default, which is
# why logind reported HandleLidSwitch=suspend while xfce did the suspending.
# Setting this alone changes nothing: bin/hibernate-install also clears
# xfce4-power-manager's logind-handle-lid-switch, or logind never sees the lid.
#
# Only the battery case escalates. On AC there is nothing to save, and staying
# in s2idle keeps the session warm.
#
# light-locker locks on logind's PrepareForSleep, not on xfce's lid handler,
# so moving the lid to logind keeps the screen locking on close.
#
# Undo: delete this file, restore the xfconf key, restart systemd-logind.
[Login]
HandleLidSwitch=suspend-then-hibernate
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
