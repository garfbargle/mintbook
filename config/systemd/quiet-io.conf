# mintbook: keep background maintenance off a disk that takes one command at a
# time. Installed by bin/quiet-timers as a drop-in on each maintenance unit.
#
# The SSD controller here carries the qdepth_one quirk: one command in flight,
# ever (docs/hardware.md). A single updatedb or apt run therefore does not
# "share" the disk with the desktop — it takes it. These caps leave the
# desktop most of the device while the job runs.
#
# Why the bandwidth caps and not ionice: mq-deadline does not implement I/O
# priorities, so IOSchedulingClass=idle is inert on this machine. It is set
# anyway, because it costs nothing and would take effect under a scheduler that
# honours it. IOReadBandwidthMax/IOWriteBandwidthMax are blk-throttle, at the
# block layer, and are enforced whatever the elevator is.
[Service]
Nice=19
IOSchedulingClass=idle
IOSchedulingPriority=7
CPUWeight=10
IOAccounting=yes
IOReadBandwidthMax=/dev/nvme0n1 32M
IOWriteBandwidthMax=/dev/nvme0n1 16M
