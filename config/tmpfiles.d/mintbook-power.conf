# Template installed by bin/power-install. It replaces @SESSION_GROUP@ with
# the invoking desktop user's primary group.
# See docs/hardware.md.
d /run/mintbook-power 0770 root @SESSION_GROUP@ -
# Policy is root-owned state, separate from the group-writable request inbox.
d /run/mintbook-policy 0755 root root -
# bin/input-boost lifts the CPU cap at the moment of input and puts it back, as
# the desktop user. A root channel in between was measured to land too late to
# help (docs/measurements/2026-09-11-boost-at-input.md).
z /sys/devices/system/cpu/intel_pstate/max_perf_pct 0664 root @SESSION_GROUP@ -
