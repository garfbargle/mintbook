# VA-API driver for the Broadwell HD 5300 on MacBook8,1.
# Installed to /etc/environment.d/90-mintbook-libva.conf. See docs/display.md.
#
# libva auto-selects iHD (intel-media-va-driver), which targets Gen9+ and on this
# Gen8 part exposes decode only. i965 is the Broadwell driver and additionally
# offers VC1, H.264 Multiview/Stereo, and H.264 hardware *encode*
# (VAEntrypointEncSlice) — iHD reports no encode entrypoint at all.
#
# Neither driver can do VP9 or AV1: Broadwell has no such silicon. Sites that
# default to VP9/AV1 still decode on the CPU. Undo: delete this file, log out.
LIBVA_DRIVER_NAME=i965
