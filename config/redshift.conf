; Colour temperature follows the sun. Location is San José — Costa Rica is
; small enough that a few degrees of lat/lon do not change sunset by much.
; Copied to ~/.config/redshift.conf. See docs/desktop.md.

[redshift]
temp-day=6500
temp-night=3500
fade=1
location-provider=manual
adjustment-method=randr

[manual]
lat=9.93
lon=-84.08
