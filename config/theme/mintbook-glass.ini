; Mintbook glass palette — canonical colour source for theme adapters.
; Colours use 8-bit sRGB; alpha is 0–255. Consumers translate these values into
; their own formats instead of trying to share one stylesheet.

[Pearl]
Top=229;231;234;245
Bottom=202;205;210;235
Edge=255;255;255;179
Shadow=65;68;74;46

; A dark, cool derivative for the XFCE panel. It keeps the panel's light
; symbolic icons readable while carrying the same blue-grey hue as Pearl.
[SystemBarLight]
Fill=215;218;222;219
Foreground=45;48;54;255

[SystemBarDark]
Fill=91;96;105;179
Foreground=255;255;255;255

; Keep the dock's existing lower-opacity, fake-glass character.
[Dock]
Top=229;231;234;150
Bottom=202;205;210;150
InnerEdge=255;255;255;50

; The popup glass: the Control Center, the battery menu, the battery history
; window and the Wi-Fi menu. All four draw in cairo and hardcode these, the
; same way userChrome.css and the rofi palettes hardcode theirs — a popup that
; has to find and parse a file before it can paint is a popup that can fail to
; paint. This section is the record they are checked against.
;
; Alpha is 0-255 here, as everywhere in this file; the cairo consumers carry
; the same value as a 0-1 float. `Fg` is opaque in both appearances.

[PopupLight]
Top=229;231;234;250
Bottom=202;205;210;247
Edge=255;255;255;191
Rim=65;68;74;46
Fg=45;48;54;255
