# Mintbook login and unlock screen. Installed to /etc/lightdm/slick-greeter.conf
# by bin/login-install. See docs/login.md.
#
# This file is the light appearance, exactly as committed. The installer
# rewrites two things and nothing else: `background`, from the wallpaper the
# desktop is actually using, and — with --dark — the three appearance keys
# marked below.
#
# The greeter is not only the login screen. light-locker hands the lock screen
# to the same binary, so this is the surface between you and the machine every
# time the lid opens. It is worth the care.
[Greeter]

# The desktop's own wallpaper, read from xfconf at install time. The greeter
# runs as the `lightdm` user, which cannot enter a 0750 home directory: a
# wallpaper kept under ~/ is unreadable to it and the installer says so and
# leaves the flat colour instead. Anything under /usr/share works.
background=/usr/share/xfce4/backdrops/linuxmint.jpg
# Pearl, from config/theme/mintbook-glass.ini. It is what you see before the
# wallpaper is decoded, so it is the first colour of the machine — and the only
# one, if the wallpaper is somewhere lightdm cannot reach.
# (--dark writes #5b6069, slate.)
background-color=#e5e7ea
# Per-user wallpapers come from AccountsService and land on the same
# unreadable-home problem. One background, always the same one.
draw-user-backgrounds=false
draw-grid=false
stretch-background-across-monitors=false

# Centred, like the machine this is pretending to be. The default is left.
content-align=center

# The desktop's chrome, so login and session are the same surface. Both of
# these must exist under /usr/share — see docs/login.md on the copy that costs.
# (--dark writes WhiteSur-Dark and WhiteSur-dark.)
theme-name=WhiteSur-Light
icon-theme-name=WhiteSur-light

# The cursor the session uses. The size is the interesting half: the greeter
# defaults to 24 and the session runs 40, so on this panel the pointer visibly
# shrank at the moment of login. It no longer does.
cursor-theme-name=Bibata-Modern-Classic
cursor-theme-size=40

# The panel's font. Measured, in a nested greeter: `font-name` moves the
# menubar and nothing else, and `xft-dpi` moved nothing at all — 96, 168 and
# 250 render the same pixels in slick-greeter 2.2.6. The user list and the
# password prompt get their size from config/lightdm/greeter.css instead, which
# is the only lever that reaches them. Both keys stay because they are correct
# and cost nothing if a later version starts honouring them.
font-name=Inter 10
xft-dpi=168
xft-antialias=true
xft-hintstyle=hintslight
xft-rgba=rgb
# `auto` lets the greeter decide to scale by 2, which on a 2304-wide panel is a
# different desktop from the one you log into. The session runs scale 1 at DPI
# 168; this matches it, deliberately, rather than guessing alongside it.
enable-hidpi=off

# The top bar's clock, same strftime string, minus the padding the panel needs.
show-clock=true
clock-format=%a %-d %b  %H:%M
# One machine. Its name is not news, the keyboard layout is not in question,
# and the quit menu duplicates the power one.
show-hostname=false
show-keyboard=false
show-quit=false
# Kept. Removing the accessibility menu is not minimalism, it is a lockout.
show-a11y=true
show-power=true
logo=
activate-numlock=false
