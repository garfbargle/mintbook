# Make the kernel actually use the zram swap on MacBook8,1 (7.7 GB, no disk swap).
# Installed to /etc/sysctl.d/99-mintbook-zram.conf. See docs/hardware.md.
#
# The stock values are spinning-disk defaults and leave zram almost untouched:
# 2.4 GB in use and 8 KB on a 3.8 GB zram device. Undo: delete this file and
# `sysctl --system` (or reboot).

# Swapping into RAM costs a compress, not a seek. Push pages out *before* the
# OOM killer wakes up, which is the reason zram is here at all.
vm.swappiness = 180

# zram is random-access. Faulting in 8 pages to use 1 is 7 wasted decompressions.
vm.page-cluster = 0

# Reclaim page cache before dentries/inodes; this machine re-walks a lot of
# small files (git, node_modules-shaped trees) and has no disk swap to fall back on.
vm.vfs_cache_pressure = 50
