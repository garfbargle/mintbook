# mintbook: keep writeback and reclaim from turning into a visible stall.
# Installed by bin/tune-install alongside 99-mintbook-zram.conf.
# See docs/feel.md.

# vm.dirty_ratio was 20 — 20% of 7.8 GB, so roughly 1.5 GB of dirty pages could
# be handed at once to a controller that accepts ONE command at a time
# (qdepth_one, docs/hardware.md). Expressed in bytes instead, and small, so a
# large save trickles out instead of arriving as a wall.
#
# This is a trade: bulk write throughput for smoothness. Setting *_bytes
# disables the corresponding *_ratio; the two are mutually exclusive.
vm.dirty_bytes = 67108864
vm.dirty_background_bytes = 33554432

# kswapd starts reclaiming this much earlier. The default of 10 lets the machine
# reach *direct* reclaim, which is what a freeze actually is. The cost is a
# little more free memory held in reserve.
vm.watermark_scale_factor = 100
