# Mint 22 ships WirePlumber 0.4, which ignores the 0.5 SPA-JSON file
# ~/.config/wireplumber/wireplumber.conf.d/51-mb81-rawpcm-speaker.conf.
# Without MacBook_Speaker_Raw, the EQ chain (MacBook_Speaker_DSP_Out) falls
# back onto IEC958 — same CS4208 converter as the speakers, so Chrome/YouTube
# is silent. This static adapter is the WP 0.4 stand-in. The card is already
# up by the time a session restart runs; cold-boot can still race (then:
# systemctl --user restart pipewire pipewire-pulse wireplumber).
#
# Live copy: ~/.config/pipewire/pipewire.conf.d/52-macbook81-raw-sink.conf
context.objects = [
    { factory = adapter
        flags = [ nofail ]
        args = {
            factory.name                    = api.alsa.pcm.sink
            node.name                       = "MacBook_Speaker_Raw"
            node.description                = "MacBook Speaker (Raw)"
            media.class                     = "Audio/Sink"
            api.alsa.path                   = "hw:PCH,2"
            api.alsa.period-size            = 1024
            api.alsa.headroom               = 1024
            audio.format                    = "S16LE"
            audio.rate                      = 44100
            audio.channels                  = 4
            audio.position                  = [ FL FR RL RR ]
            node.pause-on-idle              = false
            session.suspend-timeout-seconds = 0
            priority.session                = 100
        }
    }
]
